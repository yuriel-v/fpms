server:
  port: ${BACKEND_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fpms}
    username: ${POSTGRES_USER:fpms}
    password: ${POSTGRES_PASSWORD:fpms}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true

---
# Local profile: run outside Docker against a localhost database.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/fpms}
    username: ${POSTGRES_USER:fpms}
    password: ${POSTGRES_PASSWORD:fpms}
